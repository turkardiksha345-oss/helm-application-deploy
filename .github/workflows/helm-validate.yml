name: Validate Helm Chart

on:
  pull_request:
    paths:
      - "Application-deploy-through-helm/backend/**"
      - "Application-deploy-through-helm/frontend/**"
      - "Application-deploy-through-helm/helm/two-tier-app/**"
      - ".github/workflows/helm-validate.yml"
  workflow_dispatch:

jobs:
  helm-validate:
    name: Helm lint and template
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Application-deploy-through-helm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart
        run: helm lint helm/two-tier-app

      - name: Render chart
        run: helm template two-tier-app helm/two-tier-app

      - name: Render chart with ingress enabled
        run: helm template two-tier-app helm/two-tier-app --set ingress.enabled=true

