name: Build And Deploy To EKS

on:
  push:
    branches:
      - main
    paths:
      - "Application-deploy-through-helm/backend/**"
      - "Application-deploy-through-helm/frontend/**"
      - "Application-deploy-through-helm/helm/two-tier-app/**"
      - ".github/workflows/build-and-deploy.yml"
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  BACKEND_REPO: ${{ vars.BACKEND_REPO }}
  FRONTEND_REPO: ${{ vars.FRONTEND_REPO }}
  HELM_RELEASE_NAME: two-tier-app
  HELM_NAMESPACE: two-tier

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: Application-deploy-through-helm

    outputs:
      image-tag: ${{ steps.image.outputs.image-tag }}
      backend-image: ${{ steps.image.outputs.backend-image }}
      frontend-image: ${{ steps.image.outputs.frontend-image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image names
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          BACKEND_IMAGE="${DOCKERHUB_USERNAME}/${BACKEND_REPO}:${IMAGE_TAG}"
          FRONTEND_IMAGE="${DOCKERHUB_USERNAME}/${FRONTEND_REPO}:${IMAGE_TAG}"

          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "backend-image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend-image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: docker build -t "${{ steps.image.outputs.backend-image }}" ./backend

      - name: Build frontend image
        run: docker build -t "${{ steps.image.outputs.frontend-image }}" ./frontend

      - name: Push backend image
        run: docker push "${{ steps.image.outputs.backend-image }}"

      - name: Push frontend image
        run: docker push "${{ steps.image.outputs.frontend-image }}"

  deploy:
    name: Deploy Helm chart to EKS
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: Application-deploy-through-helm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "$EKS_CLUSTER_NAME"

      - name: Deploy application
        run: |
          helm upgrade --install "$HELM_RELEASE_NAME" helm/two-tier-app \
            --namespace "$HELM_NAMESPACE" \
            --create-namespace \
            --set backend.image.repository="${{ needs.build-and-push.outputs.backend-image }}" \
            --set backend.image.tag="" \
            --set frontend.image.repository="${{ needs.build-and-push.outputs.frontend-image }}" \
            --set frontend.image.tag=""

