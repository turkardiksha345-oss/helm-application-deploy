name: Build And Deploy To EKS

on:
  push:
    branches:
      - main
    paths:
      - "Application-deploy-through-helm/backend/**"
      - "Application-deploy-through-helm/frontend/**"
      - "Application-deploy-through-helm/helm/two-tier-app/**"
      - ".github/workflows/build-and-deploy.yml"

  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}

  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  HELM_RELEASE_NAME: two-tier-app
  HELM_NAMESPACE: two-tier

jobs:

  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read

    defaults:
      run:
        working-directory: Application-deploy-through-helm

    outputs:
      image-tag: ${{ steps.image.outputs.image-tag }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Image Tag
        id: image
        run: |
          IMAGE_TAG=${GITHUB_SHA::7}
          echo "image-tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build Backend Image
        run: |
          docker build \
            -t $DOCKERHUB_USERNAME/banking-backend:${{ steps.image.outputs.image-tag }} \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t $DOCKERHUB_USERNAME/banking-frontend:${{ steps.image.outputs.image-tag }} \
            ./frontend

      - name: Push Backend Image
        run: |
          docker push \
            $DOCKERHUB_USERNAME/banking-backend:${{ steps.image.outputs.image-tag }}

      - name: Push Frontend Image
        run: |
          docker push \
            $DOCKERHUB_USERNAME/banking-frontend:${{ steps.image.outputs.image-tag }}

  deploy:
    name: Deploy Helm Chart To EKS
    runs-on: ubuntu-latest

    needs: build-and-push

    permissions:
      contents: read

    defaults:
      run:
        working-directory: Application-deploy-through-helm

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "$EKS_CLUSTER_NAME"

      - name: Verify Cluster Access
        run: |
          kubectl get nodes

      - name: Deploy Application Using Helm
        run: |
          helm upgrade --install "$HELM_RELEASE_NAME" helm/two-tier-app \
            --namespace "$HELM_NAMESPACE" \
            --create-namespace \
            --wait \
            --timeout 5m \
            --set backend.image.repository="$DOCKERHUB_USERNAME/banking-backend" \
            --set backend.image.tag="${{ needs.build-and-push.outputs.image-tag }}" \
            --set frontend.image.repository="$DOCKERHUB_USERNAME/banking-frontend" \
            --set frontend.image.tag="${{ needs.build-and-push.outputs.image-tag }}"

      - name: Verify Deployment
        run: |
          kubectl get pods -n "$HELM_NAMESPACE"
          kubectl get svc -n "$HELM_NAMESPACE"
          kubectl get deployments -n "$HELM_NAMESPACE"
          