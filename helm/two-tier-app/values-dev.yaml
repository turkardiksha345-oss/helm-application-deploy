nameOverride: ""
fullnameOverride: ""

frontend:
  replicaCount: 1

  image:
    repository: your-dockerhub-username/employee-management-frontend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: NodePort
    port: 80
    nodePort: 30080

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

backend:
  replicaCount: 1

  image:
    repository: your-dockerhub-username/employee-management-backend
    pullPolicy: IfNotPresent
    tag: "latest"

  service:
    type: ClusterIP
    port: 3000

  env:
    APP_NAME: "Two Tier API - DEV"

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

ingress:
  enabled: false
  className: alb

  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip

  hosts:
    - host: dev.two-tier.example.com
      paths:
        - path: /
          pathType: Prefix

  tls: []

nodeSelector: {}

tolerations: []

affinity: {}